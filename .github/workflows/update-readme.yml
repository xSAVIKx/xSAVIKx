name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables a scheduled workflow after 60 days without repository
      # activity. This README commits only when a new post appears, so a quiet
      # blog stops the refresh. Enabling the workflow again resets that timer.
      - name: Keep the schedule alive
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-readme.yml/enable"

      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Refresh writing block
        run: python3 scripts/update_writing.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh writing block"
          git push
