name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      feed_url:
        description: "Feed URL to use instead of the default (for tests)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables a scheduled workflow after 60 days without repository
      # activity. This README commits only when a new post appears, so a quiet
      # blog stops the refresh. Enabling the workflow again resets that timer.
      - name: Keep the schedule alive
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-readme.yml/enable"

      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Refresh writing block
        env:
          FEED_URL: ${{ inputs.feed_url }}
        run: python3 scripts/update_writing.py ${FEED_URL:+--feed-url "$FEED_URL"}

      # A test run with another feed must not change the live README.
      - name: Commit if changed
        if: inputs.feed_url == ''
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh writing block"
          git push

      # Only a run with the real feed proves that the refresh works again.
      - name: Close the failure issue
        if: inputs.feed_url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --label refresh-failure --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --comment "The refresh works again: $RUN_URL"
            done

  # A failed run opens one issue, so that GitHub notifies the owner. Later
  # failures add a comment to that issue. The next good run closes it.
  # A test run with a bad feed_url also opens the issue. This is on purpose:
  # it is the only way to test the alert.
  alert:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create refresh-failure --color B60205 \
            --description "The README refresh workflow failed" 2>/dev/null || true
          number=$(gh issue list --state open --label refresh-failure --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The refresh failed again: $RUN_URL"
          else
            gh issue create --label refresh-failure \
              --title "README refresh is failing" \
              --body "The Update README workflow failed: $RUN_URL

          The Writing block in the README does not change until the next good run. That run closes this issue."
          fi
